<div class="flex h-dvh flex-col bg-neutral-50 text-neutral-900 dark:bg-neutral-900 dark:text-neutral-100">
  <header
    class="flex h-14 shrink-0 items-center gap-2 border-b border-neutral-200 bg-neutral-0 px-3 dark:border-neutral-0/10 dark:bg-neutral-900"
  >
    <button
      type="button"
      aria-label="Open sidebar"
      [attr.aria-expanded]="sidebarOpen()"
      class="rounded-lg p-2 hover:bg-neutral-100 md:hidden dark:hover:bg-neutral-0/10"
      (click)="sidebarOpen.set(true)"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <h1 class="min-w-0 flex-1 truncate text-lg font-semibold">AI Coding's Chatbot</h1>
    <button
      type="button"
      aria-label="Toggle theme"
      class="rounded-lg p-2 hover:bg-neutral-100 dark:hover:bg-neutral-0/10"
      (click)="theme.toggle()"
    >
      @if (theme.theme() === 'dark') {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      }
    </button>
  </header>

  <div class="relative flex min-h-0 flex-1">
    @if (sidebarOpen()) {
      <div data-testid="backdrop" class="fixed inset-0 z-30 bg-neutral-900/50 md:hidden" (click)="sidebarOpen.set(false)"></div>
    }
    <aside
      class="fixed inset-y-0 z-40 w-[260px] shrink-0 border-r border-neutral-200 bg-neutral-0 transition-[left,visibility] duration-200 md:visible md:static md:left-0 md:z-auto dark:border-neutral-0/10 dark:bg-neutral-900"
      [class]="sidebarOpen() ? 'left-0 visible' : '-left-[260px] invisible'"
    >
      <app-sidebar (closed)="sidebarOpen.set(false)" />
    </aside>

    <main class="flex min-w-0 flex-1 flex-col">
      @if (store.error(); as err) {
        <div class="bg-danger-100 px-4 py-2 text-sm text-danger-700 dark:bg-danger-500/15 dark:text-danger-500" role="alert">
          {{ err }}
        </div>
      }
      <router-outlet />
    </main>
  </div>
</div>
